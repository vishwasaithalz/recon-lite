[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-lite"
version = "0.1.0"
description = "Local-first HTTP security header analyzer"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Vishwas Aithal" }]
dependencies = []

[project.scripts]
recon-lite = "recon_lite.cli:main"

[tool.setuptools.packages.find]
include = ["recon_lite*"]
